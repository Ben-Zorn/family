<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Familien-Duell – Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>html,body{height:100%;overflow:hidden}#b{height:100vh}</style>
</head>
<body>
<div id="b"></div>
<script src="common.js"></script>
<script>
const board = createBoard(document.getElementById('b'));
let S = null;
const bc = new BroadcastChannel('fd-board');
bc.onmessage = e => {
  const m = e.data;
  if (m.type === 'state') { S = m.s; board.render(S); }
  if (m.type === 'ev') board.event(m.ev, S);
};
bc.postMessage({ type: 'hello' });
setInterval(() => bc.postMessage({ type: 'beat' }), 1000);
bc.postMessage({ type: 'beat' });
document.addEventListener('dblclick', () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen());
</script>
</body>
</html>
